# SKETCH — written by `border-collie init` (v0.6.0-sketch).
#
# The gate. One job per named command in WORKFLOW.md's `verify:` block, so the
# checks a pull request must pass and the contract border-collie reads are the
# same list. border-collie gates on check conclusions; it never reads a
# Worker's account of whether the tests passed.
#
# Overlaps this repo's existing ci-cd.yml, which already runs test/typecheck/
# lint/build on pull requests. Left duplicated deliberately in this sketch —
# whether `init` should generate this at all, or teach the operator to add an
# `e2e` job to the workflow they already have, is an open question (SKETCH.md).
name: border-collie gates

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: test
            run: npm test -- --run
          - check: typecheck
            run: npm run typecheck
          - check: lint
            run: npm run lint
          - check: build
            run: npm run build
          - check: e2e
            run: npx playwright test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18.20.8
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Install browsers
        if: matrix.check == 'e2e'
        run: npx playwright install --with-deps chromium

      - run: ${{ matrix.run }}

      - uses: actions/upload-artifact@v4
        if: failure() && matrix.check == 'e2e'
        with:
          name: playwright-report
          path: playwright-report/
