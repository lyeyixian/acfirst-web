# SKETCH — written by `border-collie init` (v0.6.0-sketch).
#
# Trimmed from border-collie's own .github/workflows/border-collie-tick.yml.
# Unchanged from the original in every way that matters: this workflow never
# touches the herded repo's toolchain, because a Tick does no work in the repo
# — it queries the tracker, claims, dispatches, and merges.
name: border-collie Tick

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Worker]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BORDER_COLLIE_APP_ID }}
          private-key: ${{ secrets.BORDER_COLLIE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install border-collie
        run: npm install -g border-collie@0.6.0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Tick
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: border-collie tick
